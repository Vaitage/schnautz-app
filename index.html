<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Schnautz Zähler</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" data-scheme="light" media="(prefers-color-scheme: light)" content="#eef1ec">
<meta name="theme-color" data-scheme="dark" media="(prefers-color-scheme: dark)" content="#0d1511">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schnautz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Wirtshaustisch – farbige Spielerkacheln im Raster (Handy 1, Tablet 2–3 Spalten), Schnautz als Strichliste, Aktionen unten am Daumen */
:root{
  --bg:#eef1ec; --paper:#fbfcf9; --ink:#18211c; --muted:#5d6b63; --line:#d6ddd7;
  --felt:#1d5a43; --felt-ink:#ffffff; --minus:#b23a2f; --soft:#e3e9e4;
  --gold:#c9a227; --silver:#98a3a7; --bronze:#a8693b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --paper:#15201a; --ink:#e7eee9; --muted:#93a399; --line:#27352d;
  --felt:#4bb187; --felt-ink:#06130d; --minus:#f07b6e; --soft:#1d2a23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1511; --paper:#15201a; --ink:#e7eee9; --muted:#93a399; --line:#27352d;
  --felt:#4bb187; --felt-ink:#06130d; --minus:#f07b6e; --soft:#1d2a23; color-scheme:dark}

html,body{height:100%;overscroll-behavior:none}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform 100ms ease-out,background-color 100ms ease-out}
input,textarea,select{font-size:16px}
.seg button:active,.gear:active,.ghead button:active,.name:active{opacity:.7}
.sw button:active{transform:scale(.9)}
button:focus-visible,input:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:1600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
#view-tisch{flex:1;min-height:0;display:flex;flex-direction:column}
#view-stats{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px;width:100%;margin:0 auto}
.addbtn{padding:10px 16px;border-radius:999px}

header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;flex:none}
h1{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;margin:0 auto 0 0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--felt)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.gear{border:0;background:var(--soft);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:21px;height:21px}

.add{display:flex;gap:8px;margin-bottom:14px;max-width:560px}
.add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:700;background:var(--soft)}
.btn.primary{background:var(--felt);color:var(--felt-ink)}
.btn.danger{background:none;color:var(--minus);border:1.5px solid currentColor}
.btn:active{transform:scale(.97)}

/* Spielerkacheln: Farbe pro Kachel über --tc (Fläche) und --ti (Schrift).
   Die Liste füllt den freien Platz, JS wählt Spalten x Reihen so, dass alle Spieler sichtbar sind;
   der Inhalt jeder Kachel skaliert mit ihrer Größe (Container-Einheiten cqh/cqw). */
.list{flex:1;min-height:0;display:grid;gap:12px;overflow-y:auto;overscroll-behavior:contain;
  grid-template-columns:minmax(0,1fr);align-content:stretch;padding-bottom:2px}
.list .empty{grid-column:1/-1;align-self:start}
.tile{--tc:#888;--ti:#fff;background:var(--tc);color:var(--ti);border-radius:20px;container-type:size;
  min-width:0;min-height:0;overflow:hidden;box-shadow:0 1px 0 rgb(0 0 0 / .06),inset 0 0 0 1px rgb(0 0 0 / .06);transition:background .2s}
.tin{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"place name tools" "pts pts pts" "sch sch sch";gap:clamp(4px,4cqh,12px) 8px;align-items:center;
  padding:clamp(8px,5cqh,18px) clamp(10px,4cqw,20px)}
.place{grid-area:place;font-family:var(--display);font-weight:900;font-size:clamp(16px,min(10cqh,7cqw),30px);min-width:1.1em;opacity:.75}
.name{grid-area:name;border:0;background:none;color:inherit;text-align:left;font-weight:700;font-size:clamp(16px,min(10cqh,7cqw),30px);
  line-height:1.2;padding:2px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{grid-area:tools;display:flex;gap:2px}
.icon{--s:clamp(36px,15cqh,46px);border:0;background:none;width:var(--s);height:var(--s);border-radius:10px;display:grid;place-items:center;color:inherit;opacity:.8}
.icon:active{background:color-mix(in srgb,var(--ti) 16%,transparent)}
.icon svg{width:58%;height:58%;min-width:20px;min-height:20px}

.pts{grid-area:pts;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;min-height:0}
.pbtn{--s:clamp(44px,min(34cqh,22cqw),100px);width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);border:0;
  font-size:calc(var(--s) * .5);font-weight:700;line-height:1;display:grid;place-items:center}
.pbtn.minus{background:color-mix(in srgb,var(--ti) 16%,transparent);color:var(--ti)}
.pbtn.plus{background:var(--ti);color:var(--tc)}
.pbtn:active{transform:scale(.94)}
.score{font-family:var(--display);font-weight:900;font-size:clamp(36px,min(40cqh,24cqw),140px);line-height:.9;text-align:center;font-variant-numeric:tabular-nums}

.sch{grid-area:sch;display:flex;align-items:center;gap:8px;min-width:0;padding-top:clamp(4px,3cqh,10px);
  border-top:1px solid color-mix(in srgb,var(--ti) 22%,transparent)}
.sch .mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.sch .lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.75;flex:none}
.sbtn{--s:clamp(30px,16cqh,46px);width:var(--s);height:var(--s);flex:none;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--ti) 35%,transparent);
  background:none;color:inherit;font-weight:700;font-size:calc(var(--s) * .5);line-height:1}
.sbtn:active{background:color-mix(in srgb,var(--ti) 16%,transparent)}
.tally{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;min-width:0;flex:1;overflow:hidden}
.five{--h:clamp(14px,10cqh,24px);position:relative;display:inline-flex;gap:3px;height:var(--h);flex:none;margin-inline:3px}
.five i{display:block;width:3px;height:var(--h);background:currentColor;border-radius:2px}
.five.done::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;background:currentColor;border-radius:2px;transform:rotate(-28deg)}
.tnum{font-family:var(--display);font-weight:800;font-size:clamp(16px,11cqh,26px);font-variant-numeric:tabular-nums;flex:none}
.tzero{opacity:.7;font-size:13px;white-space:nowrap}

.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.bar{flex:none;padding-block:10px}
.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bar .btn{padding:14px}

@media (min-width:760px){body{font-size:16px}.list{gap:14px}.bar .btn{font-size:16px}}
@media (max-width:560px){.addbtn span{display:none}.addbtn{font-size:22px;padding:4px 16px}.bar .btn{padding:12px 8px;font-size:14px}}

/* Schnautz-Tanz: Herr Schnautz tanzt im Hemd in der Spielerfarbe */
.dance{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgb(0 0 0 / .55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:dIn .2s ease-out;cursor:pointer;overflow:hidden}
.dance.out{animation:dOut .25s ease-in forwards}
@keyframes dIn{from{opacity:0}to{opacity:1}}
@keyframes dOut{to{opacity:0}}
.stage{display:grid;justify-items:center;gap:4px;pointer-events:none;padding:16px}
.stage svg.guy{width:min(52vh,70vw);height:auto;overflow:visible;filter:drop-shadow(0 10px 18px rgb(0 0 0 / .35))}
.shout{font-family:var(--display);font-weight:900;font-size:clamp(44px,12vmin,110px);line-height:.9;letter-spacing:.02em;
  text-transform:uppercase;color:#fff;text-shadow:0 4px 0 var(--dc),0 8px 20px rgb(0 0 0 / .4);animation:shout .6s ease-in-out infinite alternate}
.who2{font-weight:700;font-size:clamp(18px,3.4vmin,28px);color:#fff;background:var(--dc);color:var(--di);padding:6px 16px;border-radius:999px}
@keyframes shout{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.guy *{transform-box:fill-box}
.guy .all{transform-origin:50% 100%;animation:bob .6s ease-in-out infinite}
.guy .armL{transform-origin:100% 85%;animation:armL .3s ease-in-out infinite alternate}
.guy .armR{transform-origin:0% 85%;animation:armR .3s ease-in-out infinite alternate}
.guy .legL{transform-origin:50% 0%;animation:legL .6s ease-in-out infinite}
.guy .legR{transform-origin:50% 0%;animation:legR .6s ease-in-out infinite}
.guy .stache{transform-origin:50% 30%;animation:stache .3s ease-in-out infinite alternate}
.guy .hat{transform-origin:50% 100%;animation:hat .6s ease-in-out infinite}
.guy .brows{animation:brows .6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-7deg)}25%{transform:translateY(-14px) rotate(0)}50%{transform:translateY(0) rotate(7deg)}75%{transform:translateY(-14px) rotate(0)}}
@keyframes armL{from{transform:rotate(-30deg)}to{transform:rotate(40deg)}}
@keyframes armR{from{transform:rotate(-40deg)}to{transform:rotate(30deg)}}
@keyframes legL{0%,100%{transform:rotate(0)}25%{transform:rotate(28deg)}50%{transform:rotate(0)}}
@keyframes legR{0%,50%,100%{transform:rotate(0)}75%{transform:rotate(-28deg)}}
@keyframes stache{from{transform:scaleX(.92) rotate(-4deg)}to{transform:scaleX(1.08) rotate(4deg)}}
@keyframes hat{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-10deg)}75%{transform:translateY(-12px) rotate(10deg)}}
@keyframes brows{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.flake{position:absolute;top:-40px;width:46px;height:20px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 80px)) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.guy *,.shout,.flake{animation:none!important}}
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.rng input[type=range]{width:100%;accent-color:var(--felt);height:30px}
.rng output{font-family:var(--display);font-weight:800;font-size:22px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}

/* Statistik */
.statwrap{max-width:900px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 8px}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:11px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left;padding-left:12px}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.medal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;color:#1b1b1b}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze);color:#fff}
.games{display:grid;gap:8px}
.game{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.ghead button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.res{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;font-size:13px;font-weight:600}
.chip .medal{width:22px;height:22px;box-shadow:0 0 0 2px rgb(255 255 255 / .5)}
.medal.pl{background:rgb(0 0 0 / .18);color:inherit}
.chip em{font-style:normal;opacity:.8;font-weight:500}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile{transition:none}}
.sheet h3{font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;margin:0 0 6px}
.sheet p{color:var(--muted);margin:0 0 14px;line-height:1.45}
.sheet label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sheet input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet .seg{width:100%}.sheet .seg button{flex:1}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw button{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15);display:grid;place-items:center;padding:0}
.sw button svg{width:58%;height:58%;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.sw button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sw button[aria-pressed="true"] svg{opacity:1;transform:none}
/* Eigene Farbe: drei Schieberegler (Farbton, Sättigung, Helligkeit), stehen immer auf der aktuellen Farbe */
.mix{margin-top:12px;padding:12px;border-radius:16px;background:var(--bg);display:grid;gap:10px;border:3px solid transparent}
.mix.on{border-color:var(--ink)}
.mix .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.mix .mhead code{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mrow input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:999px;margin:0;
  box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);touch-action:pan-y;cursor:pointer;background:var(--soft)}
.mrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  border:3px solid #1b1b1b;box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.mrow input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #1b1b1b}
.mrow input[type=range]::-moz-range-track{background:transparent}
.preview{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:700;font-size:18px}
.actions{display:grid;gap:8px;margin-top:18px}
.actions.two{grid-template-columns:1fr 1fr}
.rank{display:grid;gap:6px;margin:4px 0 6px}
.rank div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-weight:600}
.rank b{font-family:var(--display);font-size:26px;margin-left:auto;font-variant-numeric:tabular-nums}
.rank em{font-style:normal;opacity:.8;font-weight:500}
.rank .pts2{margin-left:auto;opacity:.8;font-weight:500;font-variant-numeric:tabular-nums}
.rank b{margin-left:14px;min-width:4.4em;text-align:right;font-size:22px}
.kasse{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;margin-top:4px;border-top:2px solid var(--line);font-weight:700}
.kasse b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.gsum{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--felt)}
.small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
</style>

<div class="app">
  <header>
    <h1>Schnautz<span>.</span></h1>
    <button class="btn primary addbtn" id="addBtn" aria-label="Spieler hinzufügen">+<span> Spieler</span></button>
    <div class="seg" role="tablist">
      <button id="tab-tisch" role="tab" aria-selected="true" data-tab="tisch">Tisch</button>
      <button id="tab-stats" role="tab" aria-selected="false" data-tab="stats">Statistik</button>
    </div>
    <button class="gear" id="settingsBtn" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </header>

  <section id="view-tisch">
    <div class="list" id="list"></div>
  </section>

  <section id="view-stats" class="statwrap" hidden></section>

  <div class="bar" id="bar">
    <div class="in">

</div>

<div id="sheetRoot"></div>
<input id="bkFile" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>
<div id="danceRoot"></div>

<script>
const COLORS=["#e63946","#f77f00","#fcbf49","#8ac926","#2a9d8f","#1982c4","#6a4c93","#ff5d8f",
              "#8d5524","#4a4e69","#1b1b1b","#f1f1f1","#b5179e","#00b4d8","#606c38","#c1121f"];
let state={players:[]};
let games=[];
let db=null, liveRef=null, gamesCol=null;
let dirty=false, saving=false, saveTimer=null, synced=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function inkOn(hex){
  const h=String(hex).replace("#","");const n=h.length===3?h.split("").map(c=>c+c).join(""):h.padEnd(6,"8");
  const [r,g,b]=[0,2,4].map(i=>parseInt(n.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);
  return (.2126*r+.7152*g+.0722*b)>.36?"#151515":"#ffffff";
}
const tint=c=>`--tc:${esc(c)};--ti:${inkOn(c)};background:var(--tc);color:var(--ti)`;
function ranks(list){ // gleiche Punkte = gleicher Platz
  const s=[...list].sort((a,b)=>a.points-b.points);
  return s.map(p=>({...p,place:s.findIndex(q=>q.points===p.points)+1}));
}

/* ---------- Speichern ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function changed(){dirty=true;lsSet("schnautz_live",state);clearTimeout(saveTimer);saveTimer=setTimeout(persist,500);render()}
async function persist(){
  if(!liveRef){dirty=false;return}
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(persist,300);return}
  saving=true;dirty=false;
  try{await liveRef.set({players:state.players,updatedAt:Date.now()})}catch(e){console.warn(e)}
  saving=false;
}
async function saveGame(g){
  if(gamesCol){try{await gamesCol.doc(g.id).set(g);return}catch(e){console.warn(e)}}
  games=[g,...games];lsSet("schnautz_games",games);renderStats();
}
async function deleteGame(id){
  if(gamesCol){try{await gamesCol.doc(id).delete();return}catch(e){console.warn(e)}}
  games=games.filter(g=>g.id!==id);lsSet("schnautz_games",games);renderStats();
}

/* ---------- Darstellung ---------- */
function applyTheme(t){
  const r=document.documentElement;
  if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
  const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  // Statusleiste: bei "Automatisch" je Systemschema, bei fester Wahl beide Einträge auf die gewählte Farbe
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    const own=m.getAttribute("data-scheme");
    m.content=(t==="light"||t==="dark")?(dark?"#0d1511":"#eef1ec"):(own==="dark"?"#0d1511":"#eef1ec");
  });
}
let theme=lsGet("schnautz_theme","auto");applyTheme(theme);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme(theme));
$("#settingsBtn").onclick=()=>{
  const opt=(v,l)=>`<button type="button" data-t="${v}" aria-pressed="${theme===v}">${l}</button>`;
  openSheet(`<h3>Einstellungen</h3>
    <label>Darstellung</label>
    <div class="seg" id="themeSeg">${opt("auto","Automatisch")}${opt("light","Hell")}${opt("dark","Dunkel")}</div>
    <div class="small">„Automatisch“ folgt der Einstellung des Geräts.</div>
    <label for="danceR">Schnautz-Tanz</label>
    <div class="rng"><input id="danceR" type="range" min="0" max="10" step="0.5" value="${danceSecs}"><output id="danceOut">${fmtSecs(danceSecs)}</output></div>
    <div class="actions" style="margin-top:8px"><button class="btn" id="danceTry">Tanz ansehen</button></div>
    <div class="small">So lange tanzt Herr Schnautz, wenn jemand einen Schnautz bekommt. Ganz links schaltet den Tanz aus. Antippen beendet ihn vorher.</div>
    <label>Preis pro Punkt</label>
    <div class="rng"><div class="actions two" style="margin:0"><button class="btn" id="rateDown" aria-label="5 Cent weniger">− 5 ct</button><button class="btn" id="rateUp" aria-label="5 Cent mehr">+ 5 ct</button></div><output id="rateOut">${euro(rateCt)}</output></div>
    <div class="small">Beim Spielende zahlt jeder seine Punkte mal diesen Betrag. Gilt für neue Spiele, gespeicherte behalten ihren Preis.</div>
    <label>Daten sichern</label>
    <div class="actions two" style="margin-top:0"><button class="btn" id="bkSave">Sichern</button><button class="btn" id="bkLoad">Wiederherstellen</button></div>
    <div class="small">${games.length} gespeicherte ${games.length===1?"Spiel":"Spiele"} und ${state.players.length} Spieler am Tisch. „Sichern“ speichert alles als Datei, „Wiederherstellen“ spielt eine solche Datei wieder ein, auch auf einem anderen Gerät.</div>
    <div class="small">${synced?"Die Daten werden in Claude gespeichert und zwischen Geräten abgeglichen.":"Die Daten liegen auf diesem Gerät."}</div>
    <div class="actions"><button class="btn primary" data-x="close">Fertig</button></div>`,r=>{
    const dr=r.querySelector("#danceR"),dout=r.querySelector("#danceOut");
    dr.oninput=()=>{danceSecs=+dr.value;dout.textContent=fmtSecs(danceSecs);lsSet("schnautz_dance",danceSecs)};
    r.querySelector("#danceTry").onclick=()=>dance(state.players[0]||{name:"Herr Schnautz",color:"#1d5a43",schnautz:1},Math.max(danceSecs,2));
    const rOut=r.querySelector("#rateOut");
    const setRate=v=>{rateCt=Math.max(0,Math.min(500,v));rOut.textContent=euro(rateCt);lsSet("schnautz_rate",rateCt)};
    r.querySelector("#rateDown").onclick=()=>setRate(rateCt-5);
    r.querySelector("#rateUp").onclick=()=>setRate(rateCt+5);
    r.querySelector("#bkSave").onclick=exportBackup;
    r.querySelector("#bkLoad").onclick=()=>{const f=$("#bkFile");f.value="";f.click()};
    r.querySelector("#themeSeg").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;
      theme=b.dataset.t;lsSet("schnautz_theme",theme);applyTheme(theme);
      r.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  });
};

/* ---------- Sichern & Wiederherstellen ---------- */
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
async function exportBackup(){
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  const name=`schnautz-sicherung-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  const text=JSON.stringify({app:"schnautz-zaehler",version:1,exportedAt:d.toISOString(),players:state.players,games},null,2);
  if(window.claude?.use){ // in Claude
    const dl=await window.claude.use("downloads");
    if(dl){try{await dl.save({filename:name,data:text});toast("Sicherung gespeichert")}catch(e){if(e?.code!=="declined")toast("Speichern hat nicht geklappt")}return}
  }
  const file=new File([text],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Schnautz Sicherung"});toast("Sicherung bereit");return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Sicherung heruntergeladen");
}
function validBackup(o){
  if(!o||typeof o!=="object"||!Array.isArray(o.games)||!Array.isArray(o.players))return null;
  const num=v=>Math.max(0,Math.round(Number(v)||0));
  const col=v=>/^#[0-9a-f]{3,8}$/i.test(String(v))?String(v):"#888888";
  const players=o.players.filter(p=>p&&p.name).map(p=>({id:String(p.id||uid()).replace(/[^\w-]/g,"").slice(0,40)||uid(),name:String(p.name).slice(0,24),color:col(p.color),points:num(p.points),schnautz:num(p.schnautz)}));
  const gs=o.games.filter(g=>g&&Array.isArray(g.players)).map(g=>({id:String(g.id||uid()).replace(/[^\w-]/g,"").slice(0,40)||uid(),endedAt:Number(g.endedAt)||Date.now(),...(Number.isFinite(g.rate)?{rate:Math.max(0,Math.min(500,Math.round(g.rate)))}:{}),
    players:g.players.filter(p=>p&&p.name).map(p=>({name:String(p.name).slice(0,24),color:col(p.color),points:num(p.points),schnautz:num(p.schnautz),place:Math.max(1,num(p.place))}))}));
  return {players,games:gs};
}
async function writeGames(list,replace){
  if(gamesCol){
    if(replace){const keep=new Set(list.map(g=>g.id));for(const g of games)if(!keep.has(g.id)){try{await gamesCol.doc(g.id).delete()}catch(e){}}}
    for(const g of list){try{await gamesCol.doc(g.id).set(g)}catch(e){console.warn(e)}}
  }else{
    const map=new Map((replace?[]:games).map(g=>[g.id,g]));list.forEach(g=>map.set(g.id,g));
    games=[...map.values()].sort((a,b)=>b.endedAt-a.endedAt);lsSet("schnautz_games",games);renderStats();
  }
}
$("#bkFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  let data=null;try{data=validBackup(JSON.parse(await f.text()))}catch(_){}
  if(!data)return confirmSheet("Datei passt nicht","Das ist keine Schnautz-Sicherung. Wähle eine Datei, die mit „schnautz-sicherung“ beginnt.",null);
  const have=new Set(games.map(g=>g.id)),neu=data.games.filter(g=>!have.has(g.id)).length;
  openSheet(`<h3>Wiederherstellen</h3>
    <p>In der Datei: ${data.games.length} ${data.games.length===1?"Spiel":"Spiele"}, davon ${neu} neu, und ${data.players.length} Spieler am Tisch.</p>
    <p><b>Hinzufügen</b> übernimmt die neuen Spiele und lässt alles Bisherige stehen. <b>Alles ersetzen</b> löscht die aktuelle Statistik und den Tisch und spielt die Sicherung ein.</p>
    <div class="actions two"><button class="btn" data-x="add">Hinzufügen</button><button class="btn danger" data-x="rep">Alles ersetzen</button></div>
    <div class="actions" style="margin-top:8px"><button class="btn" data-x="close">Abbrechen</button></div>`,r=>{
    r.querySelector('[data-x="add"]').onclick=async()=>{closeSheet();
      if(!state.players.length&&data.players.length){state.players=data.players;changed()}
      await writeGames(data.games,false);toast(`${neu} ${neu===1?"Spiel":"Spiele"} hinzugefügt`)};
    r.querySelector('[data-x="rep"]').onclick=async()=>{closeSheet();
      state.players=data.players;changed();await writeGames(data.games,true);toast("Sicherung eingespielt")};
  });
});

/* ---------- Geld: Preis pro Punkt ---------- */
let rateCt=Number(lsGet("schnautz_rate",10));if(!(rateCt>=0&&rateCt<=500))rateCt=10;
const EUR=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const euro=ct=>EUR.format((ct||0)/100);
const gRate=g=>Number.isFinite(g.rate)?g.rate:10; // ältere Spiele ohne Preis: 0,10 €

/* ---------- Schnautz-Tanz ---------- */
let danceSecs=Number(lsGet("schnautz_dance",3));if(!(danceSecs>=0&&danceSecs<=10))danceSecs=3;
const fmtSecs=v=>v>0?String(v).replace(".",",")+" s":"Aus";
const darker=(hex,f=.72)=>{const [h,sa,l]=hexToHsl(hex);return hslToHex(h,sa,Math.round(l*f))};
const STACHE_FLAKE="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50"><path fill="#1b1b1b" d="M60 14C50 4 30 2 18 14 10 22 2 22 0 14c4 14 16 20 28 16 12-4 22-10 32-8 10-2 20 4 32 8 12 4 24-2 28-16-2 8-10 8-18 0C90 2 70 4 60 14Z"/></svg>');
function guySVG(c){
  const d=darker(c),ink=inkOn(c);
  return `<svg class="guy" viewBox="0 0 220 300" aria-hidden="true">
  <g class="all">
    <g class="legL"><rect x="78" y="215" width="20" height="50" rx="9" fill="#2b2b33"/><ellipse cx="82" cy="268" rx="20" ry="10" fill="#151515"/></g>
    <g class="legR"><rect x="122" y="215" width="20" height="50" rx="9" fill="#2b2b33"/><ellipse cx="138" cy="268" rx="20" ry="10" fill="#151515"/></g>
    <g class="armL"><path d="M68 160 Q40 150 30 118" stroke="${c}" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="30" cy="112" r="13" fill="#fff" stroke="#d8d8d8" stroke-width="2"/></g>
    <g class="armR"><path d="M152 160 Q180 150 190 118" stroke="${c}" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="190" cy="112" r="13" fill="#fff" stroke="#d8d8d8" stroke-width="2"/></g>
    <ellipse cx="110" cy="185" rx="52" ry="54" fill="${c}" stroke="${d}" stroke-width="4"/>
    <path d="M110 140v86" stroke="${d}" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
    <circle cx="110" cy="168" r="3.5" fill="${ink}" opacity=".7"/><circle cx="110" cy="190" r="3.5" fill="${ink}" opacity=".7"/><circle cx="110" cy="212" r="3.5" fill="${ink}" opacity=".7"/>
    <path d="M92 134l18 9-18 9zM128 134l-18 9 18 9z" fill="#c1121f"/><circle cx="110" cy="143" r="5" fill="#8f0d17"/>
    <circle cx="110" cy="92" r="44" fill="#f3c9a1" stroke="#d9a77f" stroke-width="3"/>
    <circle cx="80" cy="102" r="8" fill="#f29c8f" opacity=".55"/><circle cx="140" cy="102" r="8" fill="#f29c8f" opacity=".55"/>
    <g class="brows"><path d="M84 74q8-7 16 0M120 74q8-7 16 0" stroke="#1b1b1b" stroke-width="4.5" stroke-linecap="round" fill="none"/></g>
    <ellipse cx="92" cy="86" rx="5" ry="6.5" fill="#1b1b1b"/><ellipse cx="128" cy="86" rx="5" ry="6.5" fill="#1b1b1b"/>
    <circle cx="94" cy="84" r="1.8" fill="#fff"/><circle cx="130" cy="84" r="1.8" fill="#fff"/>
    <path d="M98 118q12 12 24 0" stroke="#7a2e22" stroke-width="4" stroke-linecap="round" fill="#b33a2e"/>
    <g class="stache"><path fill="#1b1b1b" d="M110 104c-8-9-26-12-40-3-8 5-15 6-21-2-2 13 8 22 22 21 15-1 26-8 39-8s24 7 39 8c14 1 24-8 22-21-6 8-13 7-21 2-14-9-32-6-40 3Z"/></g>
    <ellipse cx="110" cy="99" rx="10" ry="8" fill="#e8a882"/>
    <g class="hat"><ellipse cx="110" cy="56" rx="50" ry="9" fill="#1b1b1b"/><path d="M76 56c0-30 14-44 34-44s34 14 34 44Z" fill="#1b1b1b"/><path d="M77 47h66v8H77z" fill="${c}"/></g>
  </g></svg>`;
}
let danceT=null;
function dance(p,secs){
  const root=$("#danceRoot");clearTimeout(danceT);
  const c=p.color||"#1d5a43",n=p.schnautz||1;
  const flakes=Array.from({length:14},()=>`<img class="flake" alt="" src="${STACHE_FLAKE}" style="left:${Math.random()*100}%;--rot:${Math.round(Math.random()*720-360)}deg;animation-duration:${(1.8+Math.random()*2.2).toFixed(2)}s;animation-delay:${(Math.random()*Math.max(0,secs-1.5)).toFixed(2)}s;width:${30+Math.round(Math.random()*30)}px">`).join("");
  root.innerHTML=`<div class="dance" role="status" aria-label="Schnautz für ${esc(p.name)}" style="--dc:${esc(c)};--di:${inkOn(c)}">${flakes}
    <div class="stage">${guySVG(c)}<div class="shout">Schnautz!</div><div class="who2">${esc(p.name)} · ${n}. Schnautz</div></div></div>`;
  const ov=root.firstElementChild;
  const close=()=>{clearTimeout(danceT);if(!ov.isConnected)return;ov.classList.add("out");setTimeout(()=>{if(ov.isConnected)ov.remove()},260)};
  ov.addEventListener("click",close);
  danceT=setTimeout(close,secs*1000);
  if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(_){}
}

/* ---------- Tisch ---------- */
// Spalten x Reihen so wählen, dass alle Spieler auf einen Bildschirm passen (Kachel mind. 150px hoch)
function layout(){
  const L=$("#list"),n=state.players.length;
  if(!n||L.offsetParent===null){L.style.gridTemplateColumns="";L.style.gridTemplateRows="";return}
  const gap=parseFloat(getComputedStyle(L).rowGap)||12,W=L.clientWidth,H=L.clientHeight;
  const MINH=150,MINW=Math.min(250,W);let best=null;
  for(let c=1;c<=n;c++){
    const w=(W-gap*(c-1))/c;if(c>1&&w<MINW)break;
    const r=Math.ceil(n/c),h=(H-gap*(r-1))/r;
    const score=(h>=MINH?1e4:0)+Math.min(w,h*1.9)-(c*r-n)*6;
    if(!best||score>best.score)best={c,r,h,score};
  }
  L.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;
  L.style.gridTemplateRows=`repeat(${best.r},${best.h>=MINH?`minmax(${MINH}px,1fr)`:MINH+"px"})`;
}
try{new ResizeObserver(()=>layout()).observe($("#list"))}catch(e){addEventListener("resize",layout)}
function tally(n){
  if(!n)return '<span class="tzero">noch keiner</span>';
  let h="",left=n;const groups=Math.min(Math.ceil(n/5),4);
  for(let g=0;g<groups&&left>0;g++){const c=Math.min(5,left);left-=c;
    h+=`<span class="five${c===5?" done":""}">${"<i></i>".repeat(Math.min(c,4))}</span>`}
  if(n>20)h+='<span>…</span>';
  return h;
}
const ICON_RESET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
const ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function render(){
  const L=$("#list"), P=state.players;
  if(!P.length){L.innerHTML='<div class="empty"><b>Noch niemand am Tisch</b>Tippe oben auf „+ Spieler“. Jeder bekommt eine eigene Farbe, Punkte und Schnautz-Striche.</div>';layout();return}
  const anyPts=P.some(p=>p.points>0);
  const rk=Object.fromEntries(ranks(P).map(p=>[p.id,p.place]));
  L.innerHTML=P.map(p=>`
    <div class="tile" style="--tc:${esc(p.color)};--ti:${inkOn(p.color)}"><div class="tin">
      <span class="place">${anyPts?rk[p.id]+".":""}</span>
      <button class="name" data-a="edit" data-id="${p.id}">${esc(p.name)}</button>
      <div class="tools">
        <button class="icon" data-a="edit" data-id="${p.id}" aria-label="${esc(p.name)} bearbeiten">${ICON_EDIT}</button>
        <button class="icon" data-a="reset1" data-id="${p.id}" aria-label="${esc(p.name)} zurücksetzen">${ICON_RESET}</button>
      </div>
      <div class="pts">
        <button class="pbtn minus" data-a="p-" data-id="${p.id}" aria-label="Punkt abziehen">−</button>
        <span class="score">${p.points}</span>
        <button class="pbtn plus" data-a="p+" data-id="${p.id}" aria-label="Punkt dazu">+</button>
      </div>
      <div class="sch">
        <button class="sbtn" data-a="s-" data-id="${p.id}" aria-label="Schnautz minus">−</button>
        <div class="mid"><div class="lbl">Schnautz</div><div class="tally">${tally(p.schnautz)}</div>${p.schnautz?`<span class="tnum">${p.schnautz}</span>`:""}</div>
        <button class="sbtn" data-a="s+" data-id="${p.id}" aria-label="Schnautz plus">+</button>
      </div>
    </div></div>`).join("");
  layout();
}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const p=state.players.find(x=>x.id===b.dataset.id);if(!p)return;
  const a=b.dataset.a;
  if(a==="p+")p.points++;
  else if(a==="p-")p.points=Math.max(0,p.points-1);
  else if(a==="s+"){p.schnautz++;if(danceSecs>0)dance(p,danceSecs)}
  else if(a==="s-")p.schnautz=Math.max(0,p.schnautz-1);
  else if(a==="edit")return editSheet(p);
  else if(a==="reset1")return confirmSheet(`${p.name} zurücksetzen?`,`Punkte und Schnautz von ${p.name} gehen auf 0. Die anderen bleiben, wie sie sind.`,"Zurücksetzen",()=>{p.points=0;p.schnautz=0;changed()});
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
  changed();
});
function addPlayer(n){
  const used=state.players.map(p=>p.color);
  const color=COLORS.find(c=>!used.includes(c))||COLORS[state.players.length%COLORS.length];
  state.players.push({id:uid(),name:n,color,points:0,schnautz:0});changed();
}
$("#addBtn").onclick=()=>{
  openSheet(`<h3>Spieler hinzufügen</h3>
    <p>Name eintippen und mit „Hinzu“ oder der Eingabetaste bestätigen. Mehrere Spieler gehen direkt nacheinander.</p>
    <form class="add" id="addForm" autocomplete="off">
      <input id="newName" type="text" placeholder="Name" maxlength="24" enterkeyhint="done" autocapitalize="words" autocorrect="off" spellcheck="false">
      <button class="btn primary" type="submit">Hinzu</button>
    </form>
    <div class="res" id="addedList"></div>
    <div class="actions"><button class="btn" data-x="close">Fertig</button></div>`,r=>{
    const inp=r.querySelector("#newName"),list=r.querySelector("#addedList");
    const show=()=>list.innerHTML=state.players.map(p=>`<span class="chip" style="${tint(p.color)};padding:6px 12px">${esc(p.name)}</span>`).join("");
    show();
    r.querySelector("#addForm").onsubmit=e=>{e.preventDefault();const n=inp.value.trim();if(!n)return;addPlayer(n);inp.value="";show();inp.focus()};
    setTimeout(()=>inp.focus(),60);
  });
};
$("#resetAll").onclick=()=>{
  if(!state.players.length)return;
  confirmSheet("Alle zurücksetzen?","Alle Punkte und Schnautz-Striche gehen auf 0. Das Spiel wird nicht in der Statistik gespeichert.","Alles auf 0",()=>{state.players.forEach(p=>{p.points=0;p.schnautz=0});changed()});
};
const medal=n=>n<=3?`<span class="medal m${n}">${n}</span>`:`<span class="medal pl">${n}</span>`;
$("#endGame").onclick=()=>{
  const P=state.players;
  if(P.length<2)return confirmSheet("Zu wenig Spieler","Für ein Spiel braucht es mindestens zwei Spieler am Tisch.",null);
  const r=ranks(P);
  const total=r.reduce((t,p)=>t+p.points*rateCt,0);
  openSheet(`<h3>Spiel beenden</h3><p>Wer am wenigsten Punkte hat, gewinnt. Jeder Punkt kostet ${euro(rateCt)}.</p>
    <div class="rank">${r.map(p=>`<div style="${tint(p.color)}">${medal(p.place)}<span>${esc(p.name)}${p.schnautz?` <em>· ${p.schnautz}× Schnautz</em>`:""}</span><span class="pts2">${p.points} Pkt</span><b>${p.points?euro(p.points*rateCt):"frei"}</b></div>`).join("")}</div>
    <div class="kasse"><span>In die Kasse</span><b>${euro(total)}</b></div>
    <div class="actions two"><button class="btn" data-x="close">Weiterspielen</button><button class="btn primary" data-x="ok">Speichern &amp; neues Spiel</button></div>`,
  root=>{
    root.querySelector('[data-x="ok"]').onclick=async()=>{
      const g={id:uid(),endedAt:Date.now(),rate:rateCt,players:r.map(({name,color,points,schnautz,place})=>({name,color,points,schnautz,place}))};
      P.forEach(p=>{p.points=0;p.schnautz=0});changed();closeSheet();
      await saveGame(g);
    };

};

/* ---------- Sheets ---------- */
function openSheet(html,wire){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=root.firstElementChild;
  scrim.addEventListener("click",e=>{if(e.target===scrim||e.target.closest('[data-x="close"]'))closeSheet()});
  wire&&wire(scrim);
}
function closeSheet(){$("#sheetRoot").innerHTML=""}
function confirmSheet(title,text,okLabel,onOk){
  openSheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="actions ${okLabel?"two":""}"><button class="btn" data-x="close">${okLabel?"Abbrechen":"Alles klar"}</button>${okLabel?`<button class="btn primary" data-x="ok">${esc(okLabel)}</button>`:""}</div>`,
    r=>{const ok=r.querySelector('[data-x="ok"]');if(ok)ok.onclick=()=>{closeSheet();onOk()}});
}
function hexToHsl(hex){
  let h=String(hex).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  if(!/^[0-9a-f]{6}$/i.test(h))h="888888";
  const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let H=0,S=0;
  if(d){S=d/(1-Math.abs(2*l-1));
    H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}
  return [Math.round(H),Math.round(S*100),Math.round(l*100)];
}
function hslToHex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return "#"+[0,8,4].map(n=>Math.round(f(n)*255).toString(16).padStart(2,"0")).join("");
}
function editSheet(p){
  // Farbe und Name werden sofort übernommen; die gewählte Farbe ist mit Haken markiert
  const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const same=(a,b)=>String(a).toLowerCase()===String(b).toLowerCase();
  const sw=COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c};color:${inkOn(c)}" aria-label="Farbe ${c}" aria-pressed="${same(c,p.color)}">${CHECK}</button>`).join("");
  openSheet(`<h3>Spieler bearbeiten</h3>
    <label for="eName">Name</label><input id="eName" type="text" maxlength="24" value="${esc(p.name)}" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <label>Farbe der Kachel</label><div class="sw" id="sw">${sw}</div>
    <div class="mix" id="customRow">
      <div class="mhead"><span>Eigene Farbe</span><code id="hexOut"></code></div>
      <div class="mrow"><span>Farbton</span><input id="mH" type="range" min="0" max="360" step="1" aria-label="Farbton"></div>
      <div class="mrow"><span>Sättigung</span><input id="mS" type="range" min="0" max="100" step="1" aria-label="Sättigung"></div>
      <div class="mrow"><span>Helligkeit</span><input id="mL" type="range" min="0" max="100" step="1" aria-label="Helligkeit"></div>
    </div>
    <div class="preview" id="prev" style="${tint(p.color)}">${esc(p.name)}</div>
    <div class="actions two"><button class="btn danger" data-x="del">Entfernen</button><button class="btn primary" data-x="close">Fertig</button></div>`,
  r=>{
    const swEl=r.querySelector("#sw"),prev=r.querySelector("#prev"),nm=r.querySelector("#eName"),cust=r.querySelector("#customRow"),
      mH=r.querySelector("#mH"),mS=r.querySelector("#mS"),mL=r.querySelector("#mL"),hexOut=r.querySelector("#hexOut");
    const syncSliders=()=>{ // Regler auf die aktuelle Farbe stellen und Verläufe zeichnen
      const [h,sa,l]=hexToHsl(p.color);mH.value=h;mS.value=sa;mL.value=l;paint();
    };
    const paint=()=>{
      const h=+mH.value,sa=+mS.value,l=+mL.value;
      mH.style.background=`linear-gradient(90deg,${[0,60,120,180,240,300,360].map(x=>`hsl(${x} ${sa}% ${l}%)`).join(",")})`;
      mS.style.background=`linear-gradient(90deg,hsl(${h} 0% ${l}%),hsl(${h} 100% ${l}%))`;
      mL.style.background=`linear-gradient(90deg,#000,hsl(${h} ${sa}% 50%),#fff)`;
      hexOut.textContent=p.color.toUpperCase();
    };
    const upd=()=>{
      let hit=false;
      swEl.querySelectorAll("button").forEach(b=>{const on=same(b.dataset.c,p.color);hit=hit||on;b.setAttribute("aria-pressed",on)});
      cust.classList.toggle("on",!hit);
      prev.setAttribute("style",tint(p.color));prev.textContent=p.name;
    };
    const setColor=c=>{p.color=c;syncSliders();upd();changed()};
    swEl.onclick=e=>{const b=e.target.closest("[data-c]");if(b)setColor(b.dataset.c)};
    [mH,mS,mL].forEach(x=>x.oninput=()=>{p.color=hslToHex(+mH.value,+mS.value,+mL.value);paint();upd();changed()});
    syncSliders();
    nm.oninput=()=>{const n=nm.value.trim();if(n){p.name=n;upd();changed()}};
    nm.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();nm.blur()}};
    upd();
    r.querySelector('[data-x="del"]').onclick=()=>confirmSheet(`${p.name} entfernen?`,"Der Spieler verschwindet vom Tisch. Gespeicherte Spiele in der Statistik bleiben erhalten.","Entfernen",()=>{state.players=state.players.filter(x=>x.id!==p.id);changed()});
  });
}

/* ---------- Statistik ---------- */
function renderStats(){
  const V=$("#view-stats");
  if(!games.length){V.innerHTML='<div class="empty"><b>Noch keine Spiele gespeichert</b>Tippe am Tisch auf „Spiel beenden“. Dann landen Sieger, Plätze und Schnautz hier.</div>';return}
  const S={};
  for(const g of games)for(const p of g.players){
    const k=p.name.trim().toLowerCase();
    const s=S[k]||(S[k]={name:p.name,color:p.color,games:0,w:0,s2:0,s3:0,pts:0,sch:0,ct:0});
    s.games++;s.pts+=p.points;s.sch+=p.schnautz;s.ct+=p.points*gRate(g);if(p.place===1)s.w++;else if(p.place===2)s.s2++;else if(p.place===3)s.s3++;
  }
  const rows=Object.values(S).sort((a,b)=>b.w-a.w||b.s2-a.s2||b.s3-a.s3||(a.pts/a.games)-(b.pts/b.games));
  const totalSch=rows.reduce((t,r)=>t+r.sch,0);
  const top=rows[0];
  const fmt=new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
  V.innerHTML=`
    <div class="cards">
      <div class="kpi"><small>Spiele</small><b>${games.length}</b></div>
      <div class="kpi"><small>Schnautz</small><b>${totalSch}</b></div>
      <div class="kpi"><small>Meiste Siege</small><b>${top.w?esc(top.name):"–"}</b></div>
      <div class="kpi"><small>Kasse gesamt</small><b>${euro(rows.reduce((t,r)=>t+r.ct,0))}</b></div>
    </div>
    <h2>Rangliste</h2>
    <div class="tbl"><table>
      <thead><tr><th>Spieler</th><th><span class="medal m1">1</span></th><th><span class="medal m2">2</span></th><th><span class="medal m3">3</span></th><th>Spiele</th><th>Schnautz</th><th>Ø Pkt</th><th>Gezahlt</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><span class="dot" style="background:${esc(r.color)}"></span>${esc(r.name)}</td><td><b>${r.w}</b></td><td>${r.s2}</td><td>${r.s3}</td><td>${r.games}</td><td>${r.sch}</td><td>${(r.pts/r.games).toFixed(1).replace(".",",")}</td><td>${euro(r.ct)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h2>Alle Spiele</h2>
    <div class="games">${games.map((g,i)=>`
      <div class="game"><div class="ghead"><span>Spiel ${games.length-i} · ${fmt.format(new Date(g.endedAt))}</span><button data-del="${g.id}">Löschen</button></div>
      <div class="res">${g.players.map(p=>`<span class="chip" style="${tint(p.color)}">${medal(p.place)}${esc(p.name)} <em>${p.points} · ${euro(p.points*gRate(g))}${p.schnautz?` · ${p.schnautz}× S`:""}</em></span>`).join("")}</div>
      <div class="gsum">Kasse: ${euro(g.players.reduce((t,p)=>t+p.points*gRate(g),0))} · ${euro(gRate(g))} pro Punkt</div></div>`).join("")}
    </div>`;
  V.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmSheet("Spiel löschen?","Das Spiel wird aus der Statistik entfernt. Das lässt sich nicht rückgängig machen.","Löschen",()=>deleteGame(b.dataset.del)));
}

/* ---------- Tabs ---------- */
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("#view-tisch").hidden=t!=="tisch";$("#view-stats").hidden=t!=="stats";$("#bar").hidden=t!=="tisch";
  if(t==="stats")renderStats();else layout();
});

/* ---------- Bildschirm wach halten ---------- */
let lock=null;
async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}}catch(e){}}
document.addEventListener("pointerdown",wake,{once:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});

/* ---------- Start ---------- */
state=lsGet("schnautz_live",{players:[]});
games=lsGet("schnautz_games",[]);
render();renderStats();

(async()=>{
  if(!window.claude?.use)return;
  db=await window.claude.use("db");
  if(!db)return;
  liveRef=db.doc("tisch/aktuell");
  gamesCol=db.collection("spiele");
  liveRef.onSnapshot(s=>{
    synced=true;
    if(dirty||saving)return;
    if(s.exists){state={players:JSON.parse(JSON.stringify(s.data().players||[]))};lsSet("schnautz_live",state);render()}
    else if(state.players.length&&!s.metadata.fromCache){persist()}
  },e=>console.warn(e));
  gamesCol.orderBy("endedAt","desc").limit(500).onSnapshot(s=>{
    games=s.docs.map(d=>d.data());lsSet("schnautz_games",games);renderStats();
  },e=>console.warn(e));
})();
</script>
